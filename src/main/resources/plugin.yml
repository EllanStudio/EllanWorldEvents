name: EllanWorldEvents
version: 1.0.0
main: com.ellanstudio.worldevents.EllanWorldEventsPlugin
api-version: '1.21'
author: EllanStudio
description: Scheduled sea defense events and scalable dragon encounters for Ellan.
depend: [MythicMobs]
softdepend: [PlaceholderAPI, CMI, ExcellentEconomy, EnderDragon]
commands:
  ellanworldevents:
    description: Manage Ellan world events.
    usage: /ellanworldevents <status|start|stop|reload|anchor>
    aliases: [ewe]
permissions:
  ellanworldevents.status:
    description: View the current world event status.
    default: true
  ellanworldevents.admin:
    description: Manage Ellan world events.
    default: op
