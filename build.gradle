import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
}

group = 'com.ellanstudio'
version = '1.0.0'

def paperApiVersion = providers.gradleProperty('paperApiVersion').orElse('26.3.build.157-beta').get()
def javaToolchainVersion = providers.gradleProperty('javaToolchain').orElse('25').get().toInteger()
def javaRelease = providers.gradleProperty('javaRelease').orElse('21').get().toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaToolchainVersion)
    }
}

afterEvaluate {
    configurations.configureEach {
        if (canBeResolved) {
            attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, javaToolchainVersion)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly 'io.lumine:Mythic-Dist:5.12.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

tasks.named('jar') {
    archiveBaseName = 'EllanWorldEvents'
}

tasks.named('test') {
    useJUnitPlatform()
}
